services:
  db:
    image: postgres:16-alpine
    container_name: smit_csc_db
    restart: always
    environment:
      POSTGRES_DB: smit_csc
      POSTGRES_USER: csc_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_db_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csc_admin -d smit_csc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - csc_network

  migrate:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
      target: builder
    container_name: smit_csc_migrate
    command: sh -c "pnpm --filter @workspace/db run push --force"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://csc_admin:secure_db_password@db:5432/smit_csc}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - csc_network
    restart: "no"

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile
    container_name: smit_csc_api
    restart: always
    ports:
      # Bind to loopback only — external traffic must go through the system
      # Nginx reverse proxy (system-nginx.conf → localhost:3000 → frontend).
      # Direct access to port 5000 from the internet is now blocked.
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      PORT: "5000"
      # DATABASE_URL in .env overrides this; kept for docker-compose up without .env
      DATABASE_URL: ${DATABASE_URL:-postgresql://csc_admin:secure_db_password@db:5432/smit_csc}
      NODE_ENV: production
      PUBLIC_OBJECT_SEARCH_PATHS: "/tmp"
      PRIVATE_OBJECT_DIR: "/tmp"
      SITE_URL: "https://smitcscinfo.com"
      APP_URL: "https://smitcscinfo.com"
      SMIT_CSC_BASE_PATH: "/"
    volumes:
      - ./attached_assets:/app/attached_assets
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # /api/healthz is served by the health router (routes/health.ts)
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - csc_network
      - proxy-net

  frontend:
    build:
      context: .
      dockerfile: artifacts/smit-csc-info/Dockerfile
    container_name: smit_csc_frontend
    restart: always
    ports:
      # Bind to loopback only.
      # system-nginx.conf uses "proxy_pass http://localhost:3000" which resolves
      # to 127.0.0.1:3000 on the host — this is safe and the site remains accessible.
      - "127.0.0.1:3000:80"
    volumes:
      # NOTE: ./attached_assets is intentionally NOT mounted here.
      # KYC documents (PAN, Aadhaar, selfies) must never be served as static
      # files. They are served exclusively via the authenticated
      # GET /api/storage/objects/* endpoint. See OWNER_ACTIONS.md § KYC Backup.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - csc_network
      - proxy-net

volumes:
  postgres_data:

networks:
  csc_network:
    driver: bridge
  proxy-net:
    external: true
