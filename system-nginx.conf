# HTTP → HTTPS redirect + ACME challenge for cert renewal
  server {
      listen 80;
      server_name smitcscinfo.com www.smitcscinfo.com;

      # Let certbot serve ACME challenges for domain validation / renewal
      location /.well-known/acme-challenge/ {
          root /var/www/html;
          try_files $uri =404;
      }

      location / {
          return 301 https://$host$request_uri;
      }
  }

  # HTTPS — uses Let's Encrypt cert issued by certbot
  server {
      listen 443 ssl;
      http2 on;
      server_name smitcscinfo.com www.smitcscinfo.com;

      ssl_certificate     /etc/letsencrypt/live/smitcscinfo.com/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/smitcscinfo.com/privkey.pem;

      # certbot-generated TLS options (created when cert was first issued)
      include /etc/letsencrypt/options-ssl-nginx.conf;
      ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

      # Proxy to the frontend Docker container
      location / {
          proxy_pass http://localhost:3000;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
  }
  