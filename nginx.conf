server {
    listen 80;
    server_name localhost;

    # Security: Hide Nginx version
    server_tokens off;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Content Security Policy (Report-Only: monitors without breaking external services)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://apis.google.com https://www.youtube.com https://s.ytimg.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://api.phonepe.com https://vyapargateway.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://smit-csc-info-7f9c5.firebaseapp.com; report-uri /api/csp-report" always;

    # Force UTF-8 for all text responses so ₹, ▼, ▲ and other chars render correctly
    charset utf-8;
    charset_types text/html text/css text/plain text/xml application/javascript application/json;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json application/wasm font/woff2;
    gzip_disable "MSIE [1-6]\.";

    # Max body size for document/image uploads (matches backend limit of 16MB)
    client_max_body_size 16M;

    # Root directory for static frontend files
    root /usr/share/nginx/html;

    # Cache hashed static build assets (Vite outputs content hashes in filenames)
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|ico|svg|webp|wasm)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Always revalidate index.html so single-page app updates load immediately
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Serve static frontend SPA
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Express backend
    location /api {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Handle error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
